---
name: Build ISOs

# the installer ISOs, from the :stable images, uploaded to the internet archive
# (free, with a torrent for each file): https://archive.org/download/nekozame-os-iso
# without the IA_ACCESS_KEY and IA_SECRET_KEY secrets they stay as job artifacts.
# not on a schedule yet: bootc-image-builder doesn't know bazzite-based images
# (ID=bazzite), so this fails until it builds the live installer like bazzite does
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  IA_ITEM: "nekozame-os-iso"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ISO (${{ matrix.image }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image: [nekozame-os, nekozame-os-nvidia, nekozame-os-deck]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The installer installs this image
        run: sed -i "s|IMAGE|${{ matrix.image }}|" disk_config/iso.toml

      - name: Build the ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:stable
          chown: "1001:1001"
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Name it and make its checksum
        id: iso
        run: |
          dir="${{ steps.build.outputs.output-directory }}"
          iso="$(find "$dir" -name '*.iso' | head -1)"
          mv "$iso" "$dir/${{ matrix.image }}.iso"
          cd "$dir"
          sha256sum "${{ matrix.image }}.iso" > "${{ matrix.image }}.iso-CHECKSUM"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Upload to the internet archive
        id: ia
        if: github.event_name != 'pull_request'
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          [ -n "$IA_ACCESS_KEY_ID" ] || { echo "no internet archive keys: keeping it as a job artifact"; echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0; }
          pip install --quiet internetarchive
          cd "${{ steps.iso.outputs.dir }}"
          ia upload "$IA_ITEM" "${{ matrix.image }}.iso" "${{ matrix.image }}.iso-CHECKSUM" \
            --metadata="mediatype:software" --metadata="title:nekozame os installers" \
            --metadata="description:Installer ISOs for nekozame os: https://github.com/${{ github.repository }}" \
            --metadata="licenseurl:https://www.gnu.org/licenses/gpl-3.0.html" \
            --retries 20 --no-derive

      - name: Keep it as a job artifact
        if: github.event_name == 'pull_request' || steps.ia.outputs.skipped == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-iso
          path: ${{ steps.iso.outputs.dir }}/${{ matrix.image }}.iso*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
