---
name: Torrents

# a torrent for each installer ISO on SourceForge, in the "installers" release on GitHub
# (the ISOs are too big for GitHub itself: 2 GB a file at most). each one has SourceForge's
# download as its web seed, so it works even when nobody else is sharing it. the ISOs are
# built on the 1st and the 15th (iso/build), so this runs the day after; or by hand
on:
  schedule:
    - cron: '0 12 2,16 * *'
  workflow_dispatch:

env:
  SF_PROJECT: "nekozame-os"
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

jobs:
  torrents:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: mktorrent
        run: sudo apt-get update -q && sudo apt-get install -yq mktorrent

      - name: A torrent for each ISO
        run: |
          mkdir -p out
          for iso in nekozame-os.iso nekozame-os-nvidia.iso nekozame-os-deck.iso; do
            url="https://downloads.sourceforge.net/project/$SF_PROJECT/$iso"
            echo "== $iso"
            curl -fsSL --retry 5 -o "out/$iso-CHECKSUM" "$url-CHECKSUM" || { echo "not on SourceForge yet: skipped"; continue; }
            curl -fsSL --retry 5 -o "$iso" "$url"
            sha256sum -c "out/$iso-CHECKSUM"   # what was built, whole
            # 16 MiB pieces (right for 10 GB); open trackers, and SourceForge as a web seed
            mktorrent -l 24 -n "$iso" -o "out/$iso.torrent" \
              -a udp://tracker.opentrackr.org:1337/announce \
              -a udp://open.demonii.com:1337/announce \
              -a udp://tracker.torrent.eu.org:451/announce \
              -w "$url" \
              -c "nekozame os installer: https://github.com/${{ github.repository }}" \
              "$iso"
            rm -f "$iso"
          done
          ls -la out

      - name: Into the installers release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls out/*.torrent >/dev/null 2>&1 || { echo "no ISOs on SourceForge yet"; exit 0; }
          gh release view installers >/dev/null 2>&1 || gh release create installers --title "Installers" --latest=false --notes "x"
          gh release edit installers --notes "Live installer ISOs for nekozame os, new on the 1st and the 15th of every month. Download one with its torrent (it also downloads straight from SourceForge when nobody else is sharing it), or directly from https://sourceforge.net/projects/$SF_PROJECT/files/ . Check it against its CHECKSUM file, then write it to a USB stick."
          gh release upload installers out/* --clobber
