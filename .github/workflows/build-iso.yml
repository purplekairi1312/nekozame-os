---
name: Build ISOs

# the live installers, built on GitHub: a fallback, and a check that installer/ builds.
# the real ones are built on agartha and put on SourceForge (iso/build, iso/publish); these
# stay a few days as the run's artifacts. titanoboa makes a live system from installer/
# (nekozame os itself, with Anaconda), carrying the nekozame os image it installs.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Which ISOs (a JSON list): only the ones that need it"
        default: '["nekozame-os", "nekozame-os-nvidia", "nekozame-os-deck"]'
  pull_request:
    branches:
      - main
    paths:
      - 'installer/**'
      - '.github/workflows/build-iso.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # the live desktop: Bazzite's, as their own ISOs use (no NVIDIA driver: it's for installing)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ISO (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images || '["nekozame-os", "nekozame-os-nvidia", "nekozame-os-deck"]') }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      # (from Bazzite's workflow) the images are big: container storage on a compressed loop disk
      - name: Container storage on a bigger disk
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The live system, carrying the image
        run: |
          image="${IMAGE_REGISTRY,,}/${{ matrix.image }}:stable"
          # live, it's nekozame os itself (niri): the image it installs, or for the deck the pc one
          live="${image/nekozame-os-deck/nekozame-os}"
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="$live" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$image" \
            -t localhost/payload:latest installer/

      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ matrix.image }}.iso

      - name: Its checksum
        run: |
          # titanoboa says where it put the ISO
          mkdir -p upload
          mv "${{ steps.build.outputs.iso-dest }}" "upload/${{ matrix.image }}.iso"
          cd upload
          sha256sum "${{ matrix.image }}.iso" > "${{ matrix.image }}.iso-CHECKSUM"
          ls -la

      - name: Keep it as a job artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-iso
          path: upload/${{ matrix.image }}.iso*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
