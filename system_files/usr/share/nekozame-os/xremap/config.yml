# nekozame os: Super works like Cmd on a Mac. xremap turns Super+key into the key
# each app expects: Ctrl in apps, Ctrl+Shift in terminals (so Ctrl+C there still
# stops a program). emacs is left alone: doom binds Super+C/V/X itself, and Ctrl+C
# stays emacs's prefix. Super+T, Super+Q, Super+E, Super+B, the window keys (Super+Ctrl+F,
# Super+R, Super+O, Super+-/=, Super+arrows) and the rest are niri's (../niri/binds.kdl). your own: ~/.config/nekozame/keys.yml
keymap:
  - name: terminals
    application:
      only: [com.mitchellh.ghostty, org.kde.konsole, foot, kitty, Alacritty]
    remap:
      Super-c: C-Shift-c
      Super-v: C-Shift-v
      Super-f: C-Shift-f
      Super-w: C-Shift-w
      Super-n: C-Shift-n
      Super-a: C-Shift-a

  - name: apps
    application:
      not: [com.mitchellh.ghostty, org.kde.konsole, foot, kitty, Alacritty, emacs, Emacs]
    remap:
      Super-c: C-c
      Super-v: C-v
      Super-x: C-x
      Super-z: C-z
      Super-Shift-z: C-Shift-z
      Super-a: C-a
      Super-f: C-f
      Super-s: C-s
      Super-Shift-s: C-Shift-s
      Super-w: C-w
      Super-Shift-t: C-Shift-t
      Super-n: C-n
      Super-l: C-l
      Super-p: C-p
      Super-0: C-0
      Super-backspace: [Shift-home, backspace]
